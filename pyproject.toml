[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surveyhub"
version = "0.1.0"
description = "Survey measurement from scratch: reliability, factor analysis and invariance, item response theory and adaptive testing, survey weighting, and sensitive-question designs, each validated against a known simulated truth."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Arnaldo Mont'Alvao" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
